# BusTrack completo con un solo comando:
#   docker compose up --build
# Interfaz web:   http://localhost:8080
# API (Swagger):  http://localhost:8080/docs
#
# Los secretos tienen valores de desarrollo; para producción defínelos en un
# archivo .env junto a este archivo (ver .env.example) con APP_ENV=production.
name: bustrack

services:
  db:
    image: mysql:8.0
    container_name: bustrack-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: bustrack
      MYSQL_USER: bustrack
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bustrack}
      TZ: America/Bogota
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"  # acceso desde el equipo (pruebas y herramientas de BD)
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/test-db.sql:/docker-entrypoint-initdb.d/02-test-db.sql:ro
      - bustrack_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./backend
    container_name: bustrack-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: mysql+pymysql://bustrack:${MYSQL_PASSWORD:-bustrack}@db:3306/bustrack?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://bustrack:${MYSQL_PASSWORD:-bustrack}@db:3306/bustrack_test?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET:-docker-jwt-secret-solo-para-desarrollo-local}
      QR_SECRET: ${QR_SECRET:-docker-qr-secret-solo-para-desarrollo-local}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      SEED_DEMO: ${SEED_DEMO:-true}  # carga datos de demostración solo si la base está vacía
      CORS_ORIGINS: http://localhost:8080
    expose:
      - "8000"  # solo accesible dentro de Docker; el navegador entra por nginx
    volumes:
      - ./database:/database:ro  # schema.sql para las pruebas: docker compose exec api pytest
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  web:
    build: ./frontend
    container_name: bustrack-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  bustrack_data:
