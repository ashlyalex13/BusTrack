# Integración continua: en cada push y Pull Request se ejecutan todas las pruebas
# y se verifica que el sistema completo arranque con Docker.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + cobertura)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bustrack_test
          MYSQL_USER: bustrack
          MYSQL_PASSWORD: bustrack
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_DATABASE_URL: mysql+pymysql://bustrack:bustrack@127.0.0.1:3306/bustrack_test?charset=utf8mb4
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pruebas unitarias (sin base de datos)
        run: pytest -m unit -q
      - name: Pruebas de integración + cobertura
        run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run coverage
      - run: npm run build

  docker:
    name: Docker (despliegue completo)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Construir y levantar db + api + web
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Verificar la aplicación a través de nginx
        run: |
          curl -fsS http://localhost:8080/ | grep -q "BusTrack"
          curl -fsS http://localhost:8080/api/health | grep -q '"ok"'
          curl -fsS "http://localhost:8080/api/trips/search" > /dev/null
          curl -fsS http://localhost:8080/docs > /dev/null
      - name: Pruebas dentro del contenedor
        run: docker compose exec -T api pytest -q
      - name: Registros en caso de error
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
