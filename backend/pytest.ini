[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
addopts = -v --tb=short -p no:cacheprovider --import-mode=importlib
markers =
    unit: prueba unitaria (un módulo aislado, sin base de datos)
    integration: prueba de integración (API + MySQL de pruebas)
filterwarnings =
    ignore::DeprecationWarning:fastapi.testclient
    ignore:Using `httpx` with `starlette.testclient`
